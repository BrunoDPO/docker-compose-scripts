services:
  slskd:
    image: slskd/slskd
    container_name: slskd
#    user: "1000:1000"
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    environment:
      - SLSKD_REMOTE_CONFIGURATION=true
    volumes:
      - slskd_data:/app
    restart: unless-stopped
volumes:
  slskd_data:

services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Sao_Paulo
    volumes:
      - heimdall_data:/config
    network_mode: bridge
    ports:
      - 18082:80
#      - 8443:443
    restart: unless-stopped
volumes:
  heimdall_data:

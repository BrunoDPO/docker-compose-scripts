services:
services:
  heimdall:
    image: lscr.io/linuxserver/heimdall:latest
    container_name: heimdall
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - heimdall_data:/config
    ports:
      - 8080:80
      - 8443:443
    restart: unless-stopped
volumes:
  heimdall_data:
